; TarkovRvS -- every number the health model uses.
;
; Copy this to <game>\system\TarkovRvS.ini. Raven Shield reads it because
; each variable below is declared `config` in TarkovConfig.uc / TarkovZones.uc
; / TarkovInjector.uc, which is the only reason an Unreal ini key does
; anything at all. Changing a value here needs no recompile and no SDK.
;
; Values match the compiled defaults, so this file starts as a no-op you can
; read. CALIBRATE DamageScale FIRST -- see the comment on it below.

[TarkovRvS.TarkovConfig]
; --- zone pools: the published Escape from Tarkov figures, 440 in total -----
ZoneHealth[0]=35
ZoneHealth[1]=85
ZoneHealth[2]=70
ZoneHealth[3]=60
ZoneHealth[4]=60
ZoneHealth[5]=65
ZoneHealth[6]=65

; --- Raven Shield hit -> Tarkov damage -------------------------------------
; THE ONE NUMBER THAT MATTERS AND THE ONE NOBODY HAS MEASURED YET.
; Raven Shield's damage term is bullet energy: 9mm Parabellum 567, 5.56mm NATO
; 1442, 7.62x51mm 2547. Whether that figure reaches the script hook raw or
; already reduced by the native armour code is unknown. 0.0952 assumes raw
; (54 Tarkov damage / 567 energy). To measure it instead of trusting it:
;
;   TarkovDebugDamage 1     in the console
;   take one unsilenced 9mm round
;   DamageScale = 54 / <the raw figure it prints>
DamageScale=0.095200
bDebugDamage=False
NativeFlinchDamage=1

; --- hits on a destroyed limb go to the chest, scaled ----------------------
TransferToThorax[0]=0.000000
TransferToThorax[1]=0.000000
TransferToThorax[2]=1.500000
TransferToThorax[3]=0.700000
TransferToThorax[4]=0.700000
TransferToThorax[5]=1.000000
TransferToThorax[6]=1.000000

BlackedLimbThoraxDps=0.000000
SurgeryRestoreFraction=0.350000

; --- bleeding: published Tarkov: Arena rates -------------------------------
; light 0.8 points per 6 seconds, heavy 0.9 per 4. Live Tarkov may differ.
LightBleedDps=0.133300
HeavyBleedDps=0.225000
LightBleedChance=0.350000
HeavyBleedChance=0.120000
bBleedChanceScalesWithDamage=True

; --- fractures: limbs only, never head or thorax ---------------------------
FractureChance=0.150000
bFractureOnBlackout=True

; --- bleeding a vital to zero leaves you one hit from dead -----------------
bVitalCriticalState=True

; --- what being hurt costs you ---------------------------------------------
SpeedOneLegDown=0.550000
SpeedBothLegsDown=0.300000
PainSpeedPenalty=0.850000

; --- the kit you insert with ----------------------------------------------
Bandages=4
Tourniquets=2
Splints=2
SurgeryKits=1
Painkillers=2

BandageTime=2.000000
TourniquetTime=4.000000
SplintTime=5.000000
SurgeryTime=9.000000
PainkillerTime=2.000000
PainkillerDuration=120.000000

; --- presentation ---------------------------------------------------------
bDrawHealthPanel=True
PanelX=0.015000
PanelY=0.620000
PanelScale=1.000000
bAnnounceStateChanges=True

[TarkovRvS.TarkovZones]
; Band edges as a fraction of the pawn's collision half-height, from its
; centre. Unreal shrinks CollisionHeight when a pawn crouches, so these
; follow a crouching man for free. Prone is not handled -- see TarkovZones.uc.
HeadBand=0.780000
ThoraxBand=0.300000
StomachBand=-0.100000
ArmBand=0.550000
bProneUsesForwardAxis=False

[TarkovRvS.TarkovInjector]
; Which of the four class pointers to take over. The injector refuses to take
; one off another mod unless bForceOverOtherMods is set -- read the log line
; it writes before you set it.
bReplacePawns=True
bReplaceController=True
bReplaceHUD=True
bForceOverOtherMods=False
bLogDecisions=True
